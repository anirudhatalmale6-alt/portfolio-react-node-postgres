# One web service serving both the API and the built React app, plus a managed
# Postgres. Same origin for both, so there is no CORS to configure and the admin
# session cookie behaves the same locally and in production.
databases:
  - name: portfolio-db
    databaseName: portfolio
    plan: basic-256mb

services:
  - type: web
    name: portfolio
    runtime: node
    plan: starter
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npm run migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Set this to your own domain once the DNS is pointed at the service.
      - key: CORS_ORIGIN
        sync: false
